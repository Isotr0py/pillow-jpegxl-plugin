[package]
name = "pillow-jxl-plugin"
version = "1.3.8"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pillow_jxl"
crate-type = ["cdylib"]

[dependencies]
# extension-module is passed via pyproject.toml's [tool.maturin] features instead of
# forced here, since forcing it breaks `cargo test`/`cargo build` (no libpython link).
pyo3 = { version="0.29.0" }
jpegxl-rs = { version="0.15.0", default-features = false }
half = "2.7.1"
bytemuck = "1.24.0"

[features]
# Enables parallel processing support by enabling the "rayon" feature of jpeg-decoder.
vendored = ["jpegxl-rs/vendored"]
dynamic = []
